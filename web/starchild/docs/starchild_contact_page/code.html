<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;700;800" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Starchild Clothing - Contact Us</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #f9e006;
        --secondary-color: #001f3f;
      }
      .font-script {
        font-family: 'Dancing Script', cursive;
      }
    </style>
</head>
<body class="bg-white" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-gray-100 px-10 py-4">
<div class="flex items-center gap-3 text-navy-blue">
<svg class="text-[var(--primary-color)]" fill="none" height="32" viewBox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"></path></svg>
<h1 class="text-2xl font-bold text-[var(--secondary-color)]">Starchild Clothing</h1>
</div>
<nav class="flex items-center gap-8 text-base text-[var(--secondary-color)]">
<a class="hover:text-[var(--primary-color)] transition-colors" href="#">Shop</a>
<a class="hover:text-[var(--primary-color)] transition-colors" href="#">New Arrivals</a>
<a class="hover:text-[var(--primary-color)] transition-colors" href="#">About</a>
<a class="font-bold text-[var(--primary-color)]" href="#">Contact</a>
</nav>
<div class="flex items-center gap-4">
<button class="text-[var(--secondary-color)] hover:text-[var(--primary-color)] transition-colors"><span class="material-symbols-outlined">search</span></button>
<button class="text-[var(--secondary-color)] hover:text-[var(--primary-color)] transition-colors"><span class="material-symbols-outlined">person</span></button>
<button class="text-[var(--secondary-color)] hover:text-[var(--primary-color)] transition-colors"><span class="material-symbols-outlined">shopping_bag</span></button>
</div>
</header>
<main class="flex flex-1 justify-center items-center py-16 px-4">
<div class="w-full max-w-lg">
<div class="text-center mb-12">
<h2 class="font-script text-5xl font-bold text-[var(--secondary-color)] mb-4">Get in Touch</h2>
<p class="text-gray-600 text-lg">We'd love to hear from you. Send us a message and we'll get back to you as soon as possible.</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="name">Your Name</label>
<input class="form-input block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50 transition" id="name" placeholder="Enter your name" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="email">Your Email</label>
<input class="form-input block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50 transition" id="email" placeholder="Enter your email" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1" for="message">Your Message</label>
<textarea class="form-textarea block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50 transition" id="message" placeholder="Enter your message" rows="5"></textarea>
</div>
<div class="text-center">
<button class="inline-flex items-center justify-center rounded-md border border-transparent bg-[var(--primary-color)] px-8 py-3 text-base font-bold text-[var(--secondary-color)] hover:bg-yellow-400 transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2" type="submit">
                  Send Message
                </button>
</div>
</form>
<p class="text-center text-gray-500 mt-8">
              Or email us directly at <a class="font-semibold text-[var(--secondary-color)] hover:text-[var(--primary-color)] transition-colors" href="mailto:Starchild096@gmail.com">Starchild096@gmail.com</a>
</p>
</div>
</main>
</div>
</div>

</body></html>
