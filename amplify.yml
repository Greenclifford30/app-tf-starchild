version: 1
applications:
  - appRoot: web/starchild
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci
        build:
          commands:
            # Amplify build variables are not automatically available to the
            # Next.js SSR runtime. Persist the non-secret service configuration in the
            # monorepo app's production env file before building.
            - if [ -d web/starchild ]; then env | grep -e PRODUCTS_API_URL -e NEXT_PUBLIC_ORDERS_API_URL -e COGNITO_USER_POOL_ID -e COGNITO_USER_POOL_CLIENT_ID >> web/starchild/.env.production; else env | grep -e PRODUCTS_API_URL -e NEXT_PUBLIC_ORDERS_API_URL -e COGNITO_USER_POOL_ID -e COGNITO_USER_POOL_CLIENT_ID >> .env.production; fi
            - npm run build
      artifacts:
        # Next.js SSR output; product detail routes are generated on demand.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
